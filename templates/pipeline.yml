# ADO AI PR Review — reusable extends template.
#
# Usage in your repository:
#
#   resources:
#     repositories:
#       - repository: ado-ai-pr-review
#         type: github
#         name: KamilPieronczyk/ado-pr-agent
#         ref: refs/tags/v1.0.0          # pin to a release tag
#         endpoint: MyGitHubServiceConnection
#
#   extends:
#     template: templates/pipeline.yml@ado-ai-pr-review
#     parameters:
#       imageVersion: v1.0.0             # optional, defaults to latest

parameters:
  - name: imageVersion
    displayName: Docker image version (tag from ghcr.io/kamilpieronczyk/ado-pr-agent)
    type: string
    default: latest

  - name: pool
    displayName: Agent pool
    type: object
    default:
      vmImage: ubuntu-latest

pool: ${{ parameters.pool }}

steps:
  - checkout: self
    persistCredentials: true
    fetchDepth: 0

  - script: |
      docker pull ghcr.io/kamilpieronczyk/ado-pr-agent:${{ parameters.imageVersion }}
    displayName: Pull ADO AI review image

  - script: |
      docker run --rm \
        -v "$(Build.SourcesDirectory):/repo" \
        -w /repo \
        -e SYSTEM_ACCESSTOKEN \
        -e SYSTEM_TEAMFOUNDATIONCOLLECTIONURI="$(System.TeamFoundationCollectionUri)" \
        -e SYSTEM_TEAMPROJECT="$(System.TeamProject)" \
        -e BUILD_REPOSITORY_ID="$(Build.Repository.ID)" \
        -e BUILD_REPOSITORY_NAME="$(Build.Repository.Name)" \
        -e SYSTEM_PULLREQUEST_PULLREQUESTID="$(System.PullRequest.PullRequestId)" \
        -e SYSTEM_PULLREQUEST_SOURCEBRANCH="$(System.PullRequest.SourceBranch)" \
        -e SYSTEM_PULLREQUEST_TARGETBRANCH="$(System.PullRequest.TargetBranch)" \
        -e SYSTEM_PULLREQUEST_ISFORK="$(System.PullRequest.IsFork)" \
        -e BUILD_BUILDID="$(Build.BuildId)" \
        -e AZURE_OPENAI_BASE_URL \
        -e AZURE_OPENAI_DEPLOYMENT \
        -e AZURE_OPENAI_API_KEY \
        ghcr.io/kamilpieronczyk/ado-pr-agent:${{ parameters.imageVersion }} \
        run --repo-root /repo
    displayName: Run ADO AI PR review
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      AZURE_OPENAI_BASE_URL: $(AZURE_OPENAI_BASE_URL)
      AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
      AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
